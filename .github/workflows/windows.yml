name: Windows

on:
  push:
    branches: [dev, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify-and-package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.8'
      - name: Verify
        run: cargo xtask verify
      - name: Package
        run: python scripts/build_windows.py
      - name: Test extracted portable bundle
        shell: pwsh
        run: |
          $archive = (Get-ChildItem dist/*.zip).FullName
          python scripts/test_bundle.py $archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item RELEASE_NOTES.md dist/RELEASE_NOTES.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64
          path: |
            dist/*.zip
            dist/*.json
            dist/SHA256SUMS
            dist/RELEASE_NOTES.md
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify-and-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: stable-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a release commit on main
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Require the tag to match Cargo.toml
        run: |
          python3 - <<'PY'
          import os, re, tomllib
          with open('Cargo.toml', 'rb') as source:
              version = tomllib.load(source)['package']['version']
          assert re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', version)
          assert os.environ['GITHUB_REF_NAME'] == f'v{version}'
          PY
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-x64
          path: ${{ runner.temp }}/release-assets
      - name: Sign update metadata
        env:
          RELEASE_ASSETS: ${{ runner.temp }}/release-assets
          IMPORTER_SIGNING_KEY: ${{ secrets.IMPORTER_SIGNING_KEY }}
        run: python3 scripts/sign_release.py
      - name: Publish tagged version
        env:
          RELEASE_ASSETS: ${{ runner.temp }}/release-assets
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess
          directory = pathlib.Path(os.environ['RELEASE_ASSETS'])
          manifest = json.loads(next(directory.glob('goodtype-onenote-importer-*.json')).read_text())
          assert manifest['sourceCommit'] == os.environ['GITHUB_SHA']
          assert not manifest['sourceDirty']
          tag = 'v' + manifest['version']
          repo = os.environ['GITHUB_REPOSITORY']
          assert os.environ['GITHUB_REF'] == f'refs/tags/{tag}'
          assert re.fullmatch(r'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', tag)
          assets = [str(p) for pattern in ('*.zip','*.json','*.sig','SHA256SUMS') for p in directory.glob(pattern)]
          subprocess.run(['gh','release','create',tag,*assets,'--repo',repo,'--verify-tag',
                          '--title',tag,'--notes-file',str(directory / 'RELEASE_NOTES.md')], check=True)
          PY
